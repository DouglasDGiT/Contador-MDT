<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acesso do agente</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="topo">
    <div class="pilula-icone"></div>
    <span>Contador MDT</span>
  </div>

  <div class="container">
    <h1>Acesso do agente</h1>
    <p class="subtitulo">Entre com a senha da equipe para consultar os pacientes.</p>

    {% if erro %}
      <div class="mensagem-erro">{{ erro }}</div>
    {% endif %}

    <form method="post">
      <label class="primeiro" for="senha">Senha</label>
      <input type="password" id="senha" name="senha" required autofocus>
      <button type="submit">Entrar</button>
    </form>

    <div class="rodape-link">
      <a href="{{ url_for('pagina_envio') }}">Voltar para envio de foto</a>
    </div>
  </div>
</body>
</html>
