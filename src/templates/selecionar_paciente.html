<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirme seu cadastro</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="topo">
    <div class="pilula-icone"></div>
    <span>Contador MDT</span>
  </div>

  <div class="container">
    <h1>Encontramos mais de um cadastro</h1>
    <p class="subtitulo">Confirme qual é o seu, para continuar o envio da foto.</p>

    <form action="{{ url_for('confirmar_paciente_ambiguo') }}" method="post">
      <input type="hidden" name="token" value="{{ token }}">
      <input type="hidden" name="modelo_escolhido" value="{{ modelo_escolhido }}">

      {% for c in candidatos %}
      <label class="opcao-paciente">
        <input type="radio" name="paciente_id" value="{{ c.id }}" required style="width:auto;">
        <span>
          <strong>{{ c.nome }}</strong><br>
          <span style="color:var(--texto-suave); font-size:0.85rem;">
            SINAN {{ c.id }} &middot; {{ c.peso }}kg &middot; início {{ c.data_inicio_tratamento }}
          </span>
        </span>
      </label>
      {% endfor %}

      <button type="submit">Confirmar e enviar foto</button>
    </form>

    <div class="rodape-link">
      <a href="{{ url_for('pagina_envio') }}">Nenhum destes sou eu -- tentar novamente</a>
    </div>
  </div>
</body>
</html>
