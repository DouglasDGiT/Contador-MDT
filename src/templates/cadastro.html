<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastrar paciente</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="topo">
    <div class="pilula-icone"></div>
    <span>Contador MDT</span>
  </div>

  <div class="container">
    <a href="{{ url_for('painel') }}" style="font-size:0.88rem;">&larr; Voltar ao painel</a>

    <h1 style="margin-top:14px;">Cadastrar paciente</h1>
    <p class="subtitulo">Preencha no dia em que o paciente recebe a receita.</p>

    {% if erro %}
      <div class="mensagem-erro">{{ erro }}</div>
    {% endif %}

    <form method="post" id="form-cadastro">
      <label class="primeiro" for="sinan">Número do SINAN</label>
      <input type="text" id="sinan" name="sinan" required>

      <label for="nome">Nome do paciente</label>
      <input type="text" id="nome" name="nome" required>

      <label for="peso">Peso (kg)</label>
      <input type="number" id="peso" name="peso" step="0.1" min="20" required>

      <label for="data_inicio">Data de início do tratamento</label>
      <input type="date" id="data_inicio" name="data_inicio">

      <label for="esquema_indice">Esquema de manutenção (se já prescrito)</label>
      <select id="esquema_indice" name="esquema_indice" class="select-bonito">
        <option value="">Ainda não definido</option>
      </select>

      <button type="submit">Cadastrar</button>
    </form>
  </div>

  <script src="{{ url_for('static', filename='select-bonito.js') }}"></script>
  <script>
    const pesoInput = document.getElementById('peso');
    const select = document.getElementById('esquema_indice');

    async function atualizarOpcoes() {
      const peso = pesoInput.value;
      select.innerHTML = '<option value="">Ainda não definido</option>';
      if (!peso) return;

      const resp = await fetch(`/agente/opcoes_manutencao?peso=${peso}`);
      const dados = await resp.json();

      dados.opcoes.forEach((opcao, i) => {
        const texto = Object.entries(opcao).map(([m, q]) => `${q}x ${m}`).join(' + ');
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = texto;
        select.appendChild(opt);
      });

      // Reconstrói o dropdown customizado com as novas opções
      if (select._selectBonito) {
        atualizarOpcoesSelectBonito(select);
      }
    }

    pesoInput.addEventListener('change', atualizarOpcoes);
  </script>
</body>
</html>
